<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCart E-Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark shadow">
            <div class="container">

                <a class="navbar-brand fw-bold" href="#">
                    SmartCart
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">

                    <form class="d-flex ms-auto me-3">




                    </form>

                    <button class="btn btn-warning position-relative me-3" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        Add Product
                    </button>


                    <button class="btn btn-warning position-relative" onclick="showCartModal()">

                        Cart

                        <span id="cartCount"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            0
                        </span>

                    </button>

                </div>

            </div>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <!-- Products -->
        <div class="container mt-4">

            <div class="row" id="product-list">

            </div>

        </div>

        <!-- Modal -->
        <div class="modal fade" id="cartModal">

            <div class="modal-dialog modal-lg">

                <div class="modal-content">

                    <div class="modal-header">

                        <h4>Shopping Cart</h4>

                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>



                    </div>

                    <div class="modal-body">

                        <table class="table table-bordered table-hover text-center">

                            <thead class="table-dark">

                                <tr>
                                    <th>ID</th>
                                    <th>Image</th>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Qty</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>

                            </thead>

                            <tbody id="cartTable">

                            </tbody>

                        </table>

                        <hr>

                        <h5>
                            Total Quantity :
                            <span id="totalQty">0</span>
                        </h5>

                        <h4>
                            Grand Total :
                            ₹<span id="grandTotal">0</span>
                        </h4>

                    </div>

                    <div class="modal-footer">

                        <button class="btn btn-danger" onclick="clearCart()">
                            Clear Cart
                        </button>

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Close
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- Add Product Button -->


        <!-- Add Product Modal -->
        <div class="modal fade" id="addProductModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h4 class="modal-title">Add Product</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <form id="productForm">

                            <!-- Product Name -->
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="productName"
                                    placeholder="Enter Product Name" required>
                            </div>

                            <!-- Product Price -->
                            <div class="mb-3">
                                <label class="form-label">Product Price</label>
                                <input type="number" class="form-control" id="productPrice"
                                    placeholder="Enter Product Price" required>
                            </div>

                            <!-- Product Image -->
                            <div class="mb-3">
                                <label class="form-label">Product Image URL</label>
                                <input type="url" class="form-control" id="productImage" placeholder="Enter Image URL"
                                    required>
                            </div>





                            <!-- Submit -->
                            <button type="submit" class="btn btn-success w-100">
                                Add Product
                            </button>

                        </form>

                    </div>

                </div>
            </div>
        </div>

    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
