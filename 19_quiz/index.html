<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Application</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow-lg p-4" style="max-width:700px; width:100%;">

           
            <h2 class="text-center text-primary fw-bold mb-4">
                Quiz Application
            </h2>

            
            <div class="d-flex justify-content-between mb-3">
                <span id="qnsNumber" class="fw-bold fs-5">
                    Question 1 / 10
                </span>

                <span id="timer" class="badge bg-danger fs-6">
                    30s
                </span>
            </div>

           
            <div class="progress mb-4" style="height:12px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated"
                    id="progressBar"
                    style="width:10%;">
                </div>
            </div>

           
            <h4 id="question" class="mb-4">
                Question will appear here...
            </h4>

            <div class="d-grid gap-3">

                <button class="btn btn-outline-primary option">
                    Option 1
                </button>

                <button class="btn btn-outline-primary option">
                    Option 2
                </button>

                <button class="btn btn-outline-primary option">
                    Option 3
                </button>

                <button class="btn btn-outline-primary option">
                    Option 4
                </button>

            </div>

    
            <div class="d-flex justify-content-between mt-4">

                <button class="btn btn-secondary" id="prevBtn">
                    Previous
                </button>

                <button class="btn btn-success" id="nextBtn">
                    Next
                </button>

            </div>

    
            <div class="text-center mt-4">

                <button class="btn btn-danger px-5" id="submitBtn">
                    Submit Quiz
                </button>

            </div>

           
            <div class="text-center mt-5 d-none" id="resultBox">

                <h2 class="text-success">
                     Quiz Completed
                </h2>

                <h3 class="mt-3">
                    Your Score :
                </h3>

                <h1 id="score" class="text-primary">
                    0 / 10
                </h1>

                <button class="btn btn-primary mt-3" id="restartBtn">
                    Restart Quiz
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
